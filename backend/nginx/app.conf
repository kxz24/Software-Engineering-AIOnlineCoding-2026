server {
    listen 8000;
    server_name _;

    # 前端静态文件：由 backend/Dockerfile 在构建时把 npm run build 的产物
    # 放到 /code/build，Nginx 直接对该目录提供静态文件服务
    root /code/build;
    index index.html;

    # 前端为 React 单页应用，使用 react-router 做前端路由（/login、/post/1 等）。
    # 这些路径在服务器上并不存在对应文件，需要回退到 index.html 由前端接管，
    # 否则直接访问或刷新这些地址会得到 404
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 前端构建产物中的静态资源（js/css/media）带内容哈希，可以放心长期缓存
    location /static/ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # 反向代理：把 /api/v1 的请求转发到后端容器 app 的 8000 端口。
    # proxy_pass 后面不带路径，因此原始 URI 会被原样转发，
    # 即 /api/v1/post 会转发到 http://app:8000/api/v1/post
    location /api/v1 {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Django 后台管理与 API 文档，方便调试与检查
    location /admin {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/schema {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
