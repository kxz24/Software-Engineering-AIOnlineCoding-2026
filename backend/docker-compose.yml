name: aicoding

x-backend: &backend
  image: aicoding-backend:local
  build:
    context: ..
    dockerfile: backend/Dockerfile
    target: backend
  environment: &backend-env
    DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in backend/.env}
    JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in backend/.env}
    DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
    DJANGO_SECURE_COOKIES: ${DJANGO_SECURE_COOKIES:-0}
    MYSQL_DATABASE: aicoding
    MYSQL_USER: aicoding
    MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in backend/.env}
    CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in backend/.env}@redis:6379/0
    PROJECT_JUDGE_IMAGE: ${PROJECT_JUDGE_IMAGE:-aicoding-project-judge:latest}
    PROJECT_JUDGE_RUNTIMES_JSON: '${PROJECT_JUDGE_RUNTIMES_JSON:-{}}'
    PROJECT_MANAGED_BASE_IMAGE: ${PROJECT_MANAGED_BASE_IMAGE:-python:3.11-slim}
  networks:
    - data

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: aicoding
      MYSQL_USER: aicoding
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in backend/.env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in backend/.env}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql --protocol=TCP -h 127.0.0.1 -u \"$$MYSQL_USER\" \"$$MYSQL_DATABASE\" -e 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 24
    networks:
      - data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in backend/.env}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - data

  migrate:
    <<: *backend
    depends_on:
      mysql:
        condition: service_healthy
    command:
      - sh
      - -ec
      - |
        touch /deploy-data/aicoding_migrations/__init__.py
        python manage.py makemigrations user problem exam agent practice --noinput
        python manage.py migrate --noinput
        python manage.py collectstatic --noinput
    volumes:
      - migrations:/deploy-data/aicoding_migrations
      - django_static:/django-static

  app:
    <<: *backend
    restart: unless-stopped
    environment:
      <<: *backend-env
      AGENT_PROVIDER: ${AGENT_PROVIDER:-mock}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      AGENT_MODEL: ${AGENT_MODEL:-deepseek-chat}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    volumes:
      - migrations:/deploy-data/aicoding_migrations:ro
    networks:
      - web
      - data

  judge:
    <<: *backend
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    command: ["celery", "-A", "app", "worker", "-l", "info", "-c", "2", "--max-tasks-per-child=50"]
    volumes:
      - migrations:/deploy-data/aicoding_migrations:ro
      - /var/run/docker.sock:/var/run/docker.sock

  agent-worker:
    <<: *backend
    image: aicoding-agent-worker:local
    build:
      context: ..
      dockerfile: backend/Dockerfile
      target: agent_worker
    restart: unless-stopped
    environment:
      <<: *backend-env
      AGENT_PROVIDER: ${AGENT_PROVIDER:-mock}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      AGENT_MODEL: ${AGENT_MODEL:-deepseek-chat}
      AGENT_HARNESS_MODEL: ${AGENT_HARNESS_MODEL:-DeepSeek-V4.1-Flash-1017}
      AGENT_HARNESS_MAX_STEPS: ${AGENT_HARNESS_MAX_STEPS:-20}
      AGENT_HARNESS_WALL_SECONDS: ${AGENT_HARNESS_WALL_SECONDS:-600}
      PROJECT_JUDGE_IMAGE: ${PROJECT_JUDGE_IMAGE:-aicoding-project-judge:latest}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    command: ["celery", "-A", "app", "worker", "-Q", "agent", "-l", "info", "-c", "3", "--max-tasks-per-child=10"]
    volumes:
      - migrations:/deploy-data/aicoding_migrations:ro
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - data

  judge-base:
    image: aicoding-judge:latest
    profiles: ["build"]
    build:
      context: judge

  project-judge-base:
    image: aicoding-project-judge:latest
    build:
      context: judge
      dockerfile: ProjectDockerfile
    profiles: ["build"]
    restart: "no"
    command: ["true"]

  nginx:
    image: aicoding-nginx:local
    build:
      context: ..
      dockerfile: backend/Dockerfile
      target: nginx
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-8000}:8000"
    volumes:
      - django_static:/django-static:ro
    networks:
      - web

networks:
  web:
  data:

volumes:
  mysql_data:
  redis_data:
  migrations:
  django_static:
